<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>디자인연구소 앱 사용 매뉴얼</title>
<script>if(window.self!==window.top)document.documentElement.classList.add('embed')</script>
<style>
:root{--ink:#111827;--muted:#667085;--line:#e5e7eb;--soft:#f8fafc;--accent:#c05621;--accent-soft:#fff7ed;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#f5f6f8;scroll-behavior:smooth}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}.topbar{position:sticky;top:0;z-index:30;height:64px;border-bottom:1px solid var(--line);background:#fffffff5;backdrop-filter:blur(10px)}.topbar>div{display:flex;max-width:1440px;height:100%;margin:auto;padding:0 28px;align-items:center;gap:20px}.brand{display:flex;min-width:245px;align-items:center;gap:10px;font-size:15px;font-weight:750}.logo{display:grid;width:32px;height:32px;place-items:center;border-radius:9px;background:var(--ink);color:#fff;font-size:12px}.search{position:relative;max-width:470px;flex:1}.search span{position:absolute;left:13px;top:10px;color:#98a2b3}.search input{width:100%;height:40px;border:1px solid #d0d5dd;border-radius:9px;outline:0;padding:0 14px 0 39px}.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #c0562118}.close{margin-left:auto;height:36px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;padding:0 13px;color:#344054;font-size:13px;font-weight:650;cursor:pointer}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1440px;min-height:calc(100vh - 64px);margin:auto}aside{position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto;border-right:1px solid var(--line);background:#fff;padding:28px 20px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}aside h2{margin:8px 8px 20px;font-size:18px}aside .eyebrow{margin-left:8px}nav{display:grid;gap:4px}nav a{display:flex;min-height:42px;align-items:center;gap:10px;border-radius:8px;padding:9px 10px;color:#475467;font-size:13px;font-weight:600;text-decoration:none}nav a:hover{background:var(--soft);color:var(--ink)}nav a.active{background:var(--accent-soft);color:var(--accent)}.nav-no{display:grid;width:23px;height:23px;place-items:center;border:1px solid #d0d5dd;border-radius:7px;background:#fff;font-size:10px}.privacy{margin-top:24px;border-top:1px solid var(--line);padding:20px 9px 0;color:var(--muted);font-size:11px;line-height:1.7}main{min-width:0;padding:52px clamp(28px,5vw,76px) 100px;background:#fff}.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:34px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0 56px}.hero h1{margin:12px 0 16px;font-size:clamp(34px,4vw,54px);line-height:1.14;letter-spacing:-.04em}.hero p,.lead{margin:0;color:var(--muted);font-size:14px;line-height:1.75}.hero p{font-size:16px}.hero-flow{display:grid;gap:10px;border:1px solid var(--line);border-radius:14px;background:var(--soft);padding:18px}.hero-step{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:13px;font-size:13px;font-weight:700}.hero-step b,.step-no{display:grid;width:28px;height:28px;place-items:center;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:12px}.chapter{scroll-margin-top:86px;border-bottom:1px solid var(--line);padding:64px 0}.chapter-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:26px}.chapter h2{margin:7px 0 8px;font-size:28px;letter-spacing:-.025em}.badge{display:inline-flex;min-height:26px;align-items:center;border:1px solid #fed7aa;border-radius:999px;background:var(--accent-soft);padding:3px 9px;color:var(--accent);font-size:11px;font-weight:750;white-space:nowrap}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:18px}.card.primary{border-color:#fed7aa;background:var(--accent-soft)}.card h3{margin:10px 0 7px;font-size:15px}.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.65}.icon{display:grid;width:36px;height:36px;place-items:center;border-radius:9px;background:#f2f4f7;color:#475467;font-size:13px;font-weight:800}.primary .icon{background:#fff;color:var(--accent)}.priority{display:flex;margin-top:18px;align-items:center;justify-content:center;gap:13px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:18px;font-size:13px;font-weight:700}.priority strong{color:var(--accent)}.arrow{color:#98a2b3;font-size:18px}.steps{display:grid;gap:18px}.step{display:grid;grid-template-columns:38px minmax(0,1fr);gap:14px}.step-no{background:var(--accent);color:#fff}.step h3{margin:3px 0 6px;font-size:15px}.step p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}.shot{margin:20px 0 30px;overflow:hidden;border:1px solid #d0d5dd;border-radius:12px;background:#f2f4f7}.shot-bar{display:flex;height:38px;align-items:center;gap:6px;border-bottom:1px solid var(--line);background:#fff;padding:0 12px;color:#667085;font-size:11px}.dot{width:8px;height:8px;border-radius:50%;background:#d0d5dd}.shot img{display:block;width:100%;height:auto}.note{display:flex;gap:10px;margin-top:16px;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;background:var(--accent-soft);padding:13px 15px;color:#7c2d12;font-size:12px;line-height:1.6}.data-map{overflow:hidden;border:1px solid var(--line);border-radius:12px}.data-row{display:grid;grid-template-columns:120px minmax(180px,.8fr) 36px minmax(220px,1.2fr);align-items:center;border-bottom:1px solid var(--line);padding:14px 18px;gap:12px;font-size:13px}.data-row:last-child{border:0}.data-row b:first-child{color:var(--accent)}.data-row span{color:var(--muted)}.workflow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}.workflow span{border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:12px;font-weight:700}.workflow span:first-child{border-color:#fed7aa;background:var(--accent-soft);color:var(--accent)}.check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.check{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:13px;line-height:1.55}.check i{display:grid;width:20px;height:20px;flex:0 0 20px;place-items:center;border-radius:50%;background:#ecfdf3;color:#059669;font-size:11px;font-style:normal;font-weight:900}.empty{display:none;margin:60px 0;color:var(--muted);text-align:center}.top{position:fixed;right:24px;bottom:24px;display:grid;width:44px;height:44px;place-items:center;border:1px solid #fed7aa;border-radius:12px;background:var(--accent-soft);color:var(--accent);text-decoration:none;box-shadow:0 8px 24px #1118271f}@media(max-width:1000px){.layout{grid-template-columns:210px minmax(0,1fr)}.brand{min-width:190px}.hero{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr}.data-row{grid-template-columns:100px 1fr}.data-row .arrow{display:none}}@media(max-width:720px){.topbar>div{padding:0 14px}.brand{min-width:0}.brand span:last-child,.close{display:none}.layout{display:block}aside{position:sticky;top:64px;z-index:20;width:100%;height:auto;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}aside h2,aside .eyebrow,.privacy{display:none}nav{display:flex;width:max-content}nav a{min-height:36px;white-space:nowrap}.nav-no{display:none}main{padding:32px 18px 70px}.chapter{scroll-margin-top:118px;padding:46px 0}.chapter-head{display:block}.badge{margin-top:10px}.check-grid{grid-template-columns:1fr}}
.shot.half{max-width:760px}.kbd{font:600 11px/1.5 ui-monospace,Menlo,monospace;padding:1px 6px;border:1px solid #d0d5dd;border-bottom-width:2px;border-radius:5px;background:#fff;white-space:nowrap}.faq{display:grid;gap:10px}.faq details{border:1px solid var(--line);border-radius:10px;padding:13px 15px;font-size:13px}.faq summary{cursor:pointer;font-weight:700}.faq p{margin:8px 0 0;color:var(--muted);line-height:1.65}.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}.feat div{border:1px solid var(--line);border-radius:10px;padding:13px 14px;font-size:12.5px;line-height:1.6;color:var(--muted)}.feat b{display:block;margin-bottom:2px;color:var(--ink);font-size:13px}.steps+.shot,.shot+.steps{margin-top:22px}@media(max-width:720px){.feat{grid-template-columns:1fr}}.embed .topbar .close{display:none}.chapter .eyebrow b{color:var(--accent,#0071e3);font-weight:700}.book-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}.book-cards a{display:block;border:1px solid var(--line);border-radius:14px;padding:22px;text-decoration:none;color:inherit;background:#fff}.book-cards a:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}.book-cards h3{margin:0 0 6px;font-size:18px}.book-cards p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}@media(max-width:720px){.book-cards{grid-template-columns:1fr}}</style>
</head>
<body>
<header class="topbar" id="top"><div><div class="brand"><span class="logo">DL</span><span>디자인연구소 앱 사용 매뉴얼</span></div><button class="close" onclick="window.close()">창 닫기</button></div></header>
<main style="max-width:880px;margin:0 auto;padding:40px 20px">
<section class="hero"><div><div class="eyebrow">Manuals</div><h1>어떤 일을 하시나요?</h1><p>과제 입력은 연구소 모두가, 성과관리는 팀장이 씁니다. 각 매뉴얼은 준비할 데이터부터 순서대로 안내합니다.</p></div></section>
<div class="book-cards">
<a href="tasks.html"><h3>과제 입력 매뉴얼</h3><p>구글시트 연결 → 로그인 → 연도 고르기 → 추진현황 입력 · 일정 칠하기 · 저장 → 진척률</p></a>
<a href="perf.html"><h3>성과관리 매뉴얼</h3><p>준비(과제 가져올 곳 · 인사기록카드 · 이전 성과) → 프로젝트 · 평가 대상 → 평가과제 · 피어리뷰 · 평가하기 → 승진 시뮬레이션 · 면담</p></a>
</div>
<p class="privacy" style="margin-top:28px">화면의 인물·과제·조직 정보는 모두 설명용 가상 데이터입니다.</p>
</main>
</body>
</html>
