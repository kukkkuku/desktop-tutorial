name: Deploy to GitHub Pages

# 배포는 main 하나만 한다. 예전에는 main(기존 버전)을 루트에, 개선 버전을
# /preview-v2/에, 그 이전 버전을 /preview/에 함께 올려 세 벌을 나란히 놓고
# 비교했는데, 개선 버전이 그대로 본 버전이 되면서 비교 대상이 없어졌다.
# 여러 브랜치를 동시에 빌드하면 어느 주소가 최신인지 헷갈리고("배포가 안
# 됐다"의 실제 원인이 대부분 이것이었다) 빌드 시간도 세 배로 든다.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build
        env:
          # 구글 드라이브 저장·로그인용 OAuth 클라이언트 ID. 반드시 저장소
          # Settings → Secrets and variables → Actions(repository secret)에
          # GOOGLE_CLIENT_ID로 등록해야 이 job(build, environment 미지정)에서
          # 읽힌다 -- Settings → Environments → github-pages 아래(environment
          # secret)에 등록하면 deploy job에서만 보이고 여기서는 빈 값이 된다.
          # 값이 비어 있으면 로그인 화면이 그 사실을 알려주고, Google 연동
          # 없이 쓰는 모드로만 들어갈 수 있다(GoogleSignInGate).
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
