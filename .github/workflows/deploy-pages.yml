name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/ux-performance-evaluation-app-zfczzk
      - claude/v2-workspace-periods
      - claude/figma-design-impl-tw1f7x
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-main

      - name: Checkout preview (claude/v2-workspace-periods)
        uses: actions/checkout@v4
        with:
          ref: claude/v2-workspace-periods
          path: site-preview

      - name: Checkout preview-v2 (claude/figma-design-impl-tw1f7x)
        uses: actions/checkout@v4
        with:
          ref: claude/figma-design-impl-tw1f7x
          path: site-preview-v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            site-main/package-lock.json
            site-preview/package-lock.json
            site-preview-v2/package-lock.json

      - name: Build production
        working-directory: site-main
        run: |
          npm ci
          npm run build

      - name: Build preview
        working-directory: site-preview
        run: |
          npm ci
          npm run build
        env:
          VITE_BASE_PATH: /desktop-tutorial/preview/

      - name: Build preview-v2
        working-directory: site-preview-v2
        run: |
          npm ci
          npm run build
        env:
          VITE_BASE_PATH: /desktop-tutorial/preview-v2/

      - name: Combine into one Pages artifact (production at /, preview at /preview/, preview-v2 at /preview-v2/)
        run: |
          mkdir -p combined
          cp -r site-main/dist/. combined/
          mkdir -p combined/preview
          cp -r site-preview/dist/. combined/preview/
          mkdir -p combined/preview-v2
          cp -r site-preview-v2/dist/. combined/preview-v2/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: combined

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
