name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/ux-performance-evaluation-app-zfczzk
      - claude/v2-workspace-periods
      - claude/performance-management-pwa-v2-2ba605
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-main

      - name: Checkout preview (claude/v2-workspace-periods, existing version)
        uses: actions/checkout@v4
        with:
          ref: claude/v2-workspace-periods
          path: site-preview

      - name: Checkout preview-v2 (claude/performance-management-pwa-v2-2ba605, improved version)
        uses: actions/checkout@v4
        with:
          ref: claude/performance-management-pwa-v2-2ba605
          path: site-preview-v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            site-main/package-lock.json
            site-preview/package-lock.json
            site-preview-v2/package-lock.json

      - name: Build production
        working-directory: site-main
        run: |
          npm ci
          npm run build

      - name: Build preview (existing version)
        working-directory: site-preview
        run: |
          npm ci
          npm run build
        env:
          VITE_BASE_PATH: /desktop-tutorial/preview/

      - name: Build preview-v2 (improved version)
        working-directory: site-preview-v2
        run: |
          npm ci
          npm run build
        env:
          VITE_BASE_PATH: /desktop-tutorial/preview-v2/
          # 구글 드라이브 저장(선택 기능)용 OAuth 클라이언트 ID. 반드시
          # 저장소 Settings → Secrets and variables → Actions(repository
          # secret)에 GOOGLE_CLIENT_ID로 등록해야 이 job(build, environment
          # 미지정)에서 읽힌다 -- Settings → Environments → github-pages
          # 아래(environment secret)에 등록하면 deploy job에서만 보이고
          # 여기서는 빈 값이 된다. 값이 비어 있으면 "Google Drive" 버튼
          # 자체가 렌더링되지 않는다(비활성이 아니라 아예 안 보임).
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Combine into one Pages artifact (production at /, existing at /preview/, improved at /preview-v2/)
        run: |
          mkdir -p combined
          cp -r site-main/dist/. combined/
          mkdir -p combined/preview
          cp -r site-preview/dist/. combined/preview/
          mkdir -p combined/preview-v2
          cp -r site-preview-v2/dist/. combined/preview-v2/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: combined

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
